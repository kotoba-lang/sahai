name: CI
# Amu selfhost gates only. The JVM and nbb (Node.js) are not used, so they are
# not part of CI/CD (owner 2026-10-22; AGENTS.md). Each kotoba/**/*.kotoba
# module's test-* are compiled by the pinned Amu root compiler into a
# loaderless aarch64-linux static image and run on a native arm64 kernel: no
# Node.js, nbb, JVM, babashka, C toolchain or emulation.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # kotoba-lang/amu main; move the commit and the sha256 together.
  AMU_COMMIT: f5b11a08a88c11ed9f1ab2347400bca1da75d8e9
  AMU_ROOT_SHA256: 8256bfd8462c2014bf1864f154e88aa7cbb16eda7754aaabf8bf2303dcfc8dc7
jobs:
  test:
    # main's branch protection requires a check named "CI"; without this the
    # check run is called "test" and the required context never reports.
    name: CI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Amu root compiler
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/root.elf" \
            "https://raw.githubusercontent.com/kotoba-lang/amu/$AMU_COMMIT/seed/bootstrap/aarch64-linux-static-root.elf"
          echo "$AMU_ROOT_SHA256  $RUNNER_TEMP/root.elf" | sha256sum -c -
      # Every module must carry test-*; a module without them fails the gate.
      - name: Selfhost gates (every kotoba/ module)
        run: |
          set -eu
          modules=$(find kotoba -name '*.kotoba' | sort)
          if [ -z "$modules" ]; then
            echo "::error::no Kotoba module under kotoba/"
            exit 1
          fi
          for m in $modules; do
            scripts/selfhost-gate.sh "$RUNNER_TEMP/root.elf" "$m"
          done
      # A gate that cannot fail proves nothing. Letting an equal epoch displace
      # a live holder must clear test-claim's bit: 15 -> 11.
      - name: "Guard: negative control (mutated fence gives 11)"
        run: |
          set -eu
          m="$RUNNER_TEMP/fence-mutant.kotoba"
          sed 's|(= (claim-reason true "n2" false 5 5 "n1") "fence/held-by-other")|(= (claim-reason true "n2" false 5 5 "n1") "fence/higher-epoch")|' \
            kotoba/sahai/fence.kotoba > "$m"
          if cmp -s kotoba/sahai/fence.kotoba "$m"; then
            echo "::error::the mutation did not apply"
            exit 1
          fi
          scripts/selfhost-gate.sh "$RUNNER_TEMP/root.elf" "$m" 11
      - run: bash deploy/validate-packaging.sh
