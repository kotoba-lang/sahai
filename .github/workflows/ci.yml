name: CI
# Amu selfhost gate only. The JVM and nbb (Node.js) are not used, so they are
# not part of CI/CD (owner 2026-10-22; AGENTS.md). kotoba/sahai/fence.kotoba's
# test-* are compiled by the pinned Amu root compiler into a loaderless
# aarch64-linux static image and run on a native arm64 kernel: no Node.js,
# nbb, JVM, babashka, C toolchain or emulation.
#
# CDCI is stopped (com-junkawasaki/root AGENTS.md) and this workflow stays
# disabled until the owner enables it; the gate is the README's, which runs
# the same steps locally under podman.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # kotoba-lang/amu main; move the commit and the sha256 together.
  AMU_COMMIT: f5b11a08a88c11ed9f1ab2347400bca1da75d8e9
  AMU_ROOT_SHA256: 8256bfd8462c2014bf1864f154e88aa7cbb16eda7754aaabf8bf2303dcfc8dc7
jobs:
  test:
    # main's branch protection requires a check named "CI"; without this the
    # check run is called "test" and the required context never reports.
    name: CI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Amu root compiler
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/root.elf" \
            "https://raw.githubusercontent.com/kotoba-lang/amu/$AMU_COMMIT/seed/bootstrap/aarch64-linux-static-root.elf"
          echo "$AMU_ROOT_SHA256  $RUNNER_TEMP/root.elf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/root.elf"
      # The gate keeps the module after its ns form and adds a main that sets
      # one bit per test-*: 15 when all four hold. The negative control lets an
      # equal epoch displace a live holder, which must clear test-claim's bit
      # (11); a gate that cannot fail proves nothing.
      - name: Selfhost gate and negative control
        run: |
          set -eu
          G="$RUNNER_TEMP"
          F=kotoba/sahai/fence.kotoba
          sed 's|(= (claim-reason true "n2" false 5 5 "n1") "fence/held-by-other")|(= (claim-reason true "n2" false 5 5 "n1") "fence/higher-epoch")|' \
            "$F" > "$G/mutant.kotoba"
          if cmp -s "$F" "$G/mutant.kotoba"; then
            echo "::error::the mutation did not apply"
            exit 1
          fi
          for case in "$F:15" "$G/mutant.kotoba:11"; do
            src=${case%:*} expect=${case##*:}
            end=$(grep -n 'test-epoch\]))' "$src" | cut -d: -f1)
            { echo '(ns sahai-fence-gate (:export [main]))'
              tail -n +$((end + 1)) "$src"
              echo '(defn main [] :i64'
              echo '  (+ (if (test-beats) 1 0) (+ (if (test-expired) 2 0)'
              echo '  (+ (if (test-claim) 4 0) (if (test-epoch) 8 0)))))'
            } > "$G/gate-$expect.kotoba"
            # the compiler only writes a NEW output file
            (cd "$G" && KEXE_CAP_RESOURCES_35="$G" ./root.elf compile "$G/gate-$expect.kotoba" \
              --target aarch64-linux --output "$G/gate-$expect.elf" --format static)
            chmod +x "$G/gate-$expect.elf"
            report=$(cd "$G" && KEXE_STRUCTURED_REPORT=1 "./gate-$expect.elf" 2>&1)
            echo "$src -> $report"
            case "$report" in
              *":status :ok :result $expect "*) ;;
              *) echo "::error::$src: expected :result $expect"; exit 1 ;;
            esac
          done
      - run: bash deploy/validate-packaging.sh
